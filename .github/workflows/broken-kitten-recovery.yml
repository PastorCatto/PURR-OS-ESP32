name: broken-kitten-recovery
on:
  push:
    paths: ["tools/broken-kitten-recovery/**", "PurrOS/components/coreos/keys/**"]
  pull_request:
    paths: ["tools/broken-kitten-recovery/**"]
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/broken-kitten-recovery
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: broken-kitten-recovery-${{ matrix.os }}
          path: |
            tools/broken-kitten-recovery/target/release/broken-kitten-recovery
            tools/broken-kitten-recovery/target/release/broken-kitten-recovery.exe
          if-no-files-found: ignore
