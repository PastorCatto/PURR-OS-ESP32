<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, password with the d-pad keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 480px; box-sizing: border-box; background: #f4f1ea; color: #14120f; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 44px; box-sizing: border-box; padding: 0 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 4px solid #14120f; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.1em">
<span>20:59</span>
<span>PASSWORD</span>
<span style="justify-self: end">
<span style="display: inline-block; width: 44px; height: 14px; border: 3px solid #14120f; box-sizing: border-box" aria-label="Battery 87 percent" role="img"><span style="display: block; width: 87%; height: 100%; background: #14120f"></span></span>
</span>
</div>

<div style="box-sizing: border-box; padding: 14px 28px 0; display: flex; align-items: center; gap: 18px">
<span style="width: 56px; height: 56px; flex-shrink: 0; box-sizing: border-box; background: {{accent}}; border: 3px solid #14120f; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; line-height: 1">M</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">MEOW</span>
<span style="display: block; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; margin-top: 2px">ADMINISTRATOR</span>
</span>
<span style="display: flex; gap: 8px" aria-label="Four characters typed" role="img">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
<span style="width: 28px; height: 40px; box-sizing: border-box; border: 3px solid #14120f; background: {{d.bg}}"></span>
</sc-for>
</span>
</div>

<div style="box-sizing: border-box; padding: 6px 28px 0; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; height: 24px">TYPE YOUR PASSWORD</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 0 28px; display: flex; flex-direction: column; gap: 6px; min-height: 0; justify-content: center">
<sc-for list="{{keyrows}}" as="kr" hint-placeholder-count="4">
<div style="display: flex; gap: 6px">
<sc-for list="{{kr.keys}}" as="k" hint-placeholder-count="10">
<div style="flex: {{k.grow}} 1 0; min-width: 0; height: 50px; box-sizing: border-box; background: {{k.bg}}; color: {{k.fg}}; border: {{k.border}}; display: flex; align-items: center; justify-content: center; font-size: {{k.size}}px; font-weight: 700; line-height: 1; font-family: {{k.font}}">{{k.label}}</div>
</sc-for>
</div>
</sc-for>
</div>

<div style="height: 52px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 20px; background: #14120f; color: #f4f1ea; font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.04em">
<span><span style="color: {{accent}}">◀▶▲▼</span> MOVE</span>
<span><span style="color: {{accent}}">A</span> TYPE</span>
<span><span style="color: {{accent}}">B</span> DELETE</span>
<span><span style="color: {{accent}}">X</span> SHIFT</span>
<span style="margin-left: auto"><span style="color: {{accent}}">FUNC</span> SIGN IN</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#2b59ff","#1f9d55","#e0268f"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff5a1f';
    const rows = [
      ['1','2','3','4','5','6','7','8','9','0'],
      ['q','w','e','r','t','y','u','i','o','p'],
      ['a','s','d','f','g','h','j','k','l','-'],
      ['SHIFT','z','x','c','v','b','n','m','DEL']
    ];
    const focus = 'e';
    const keyrows = rows.map((r) => ({
      keys: r.map((label) => {
        const on = label === focus;
        const word = label.length > 1;
        return {
          label,
          grow: word ? 1.6 : 1,
          size: word ? 14 : 26,
          font: word ? "'Space Mono', monospace" : "'Space Grotesk', sans-serif",
          bg: on ? accent : (word ? '#14120f' : '#e7e2d5'),
          fg: on ? '#14120f' : (word ? '#f4f1ea' : '#14120f'),
          border: on ? '4px solid #14120f' : '2px solid #14120f'
        };
      })
    }));
    const dots = [1, 1, 1, 1, 0, 0, 0, 0].map((f) => ({ bg: f ? '#14120f' : 'transparent' }));
    return { keyrows, dots, accent };
  }
}
</script>
</body>
</html>
