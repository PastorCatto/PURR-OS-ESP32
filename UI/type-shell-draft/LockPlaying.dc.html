<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lock screen, music playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 480px; box-sizing: border-box; background: #14120f; color: #f4f1ea; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; overflow: hidden">

<div style="width: 480px; flex-shrink: 0; box-sizing: border-box; padding: 32px 0 32px 36px; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; justify-content: space-between; padding-right: 28px; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.1em">
<span style="display: flex; align-items: center; gap: 12px">
<svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="{{accent}}" stroke-width="3" aria-hidden="true"><rect x="2" y="11" width="18" height="13" fill="{{accent}}"/><path d="M6 11V7a5 5 0 0 1 10 0v4"/></svg>
LOCKED</span>
<span style="color: {{accent}}">▶ PLAYING</span>
</div>

<div style="display: flex; gap: 22px; margin-top: 24px; padding-right: 22px">
<div style="width: 232px; height: 232px; flex-shrink: 0; position: relative; overflow: hidden; background: #14120f; border: 4px solid #f4f1ea; box-sizing: border-box; box-shadow: 8px 8px 0 {{accent}}; margin: 0 8px 8px 0" role="img" aria-label="Cover art placeholder">
<div style="position: absolute; left: 32px; top: 16px; width: 140px; height: 140px; border-radius: 70px; background: #f4f1ea"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: repeating-linear-gradient(180deg, #14120f 0, #14120f 10px, {{accent}} 10px, {{accent}} 20px)"></div>
</div>
<div style="display: flex; flex-direction: column; min-width: 0; padding-top: 2px">
<div style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; color: #bdb8ab">TRACK 03 / 11</div>
<div style="font-size: 46px; font-weight: 700; line-height: 0.95; letter-spacing: -0.03em; margin-top: 8px">Night Shift</div>
<div style="font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; margin-top: 10px; color: {{accent}}; line-height: 1.35">THE BENCH<br>NOTES</div>
</div>
</div>

<div style="margin-top: 10px; padding-right: 28px">
<div style="height: 14px; border: 3px solid #f4f1ea; box-sizing: border-box"><div style="width: 43%; height: 100%; background: {{accent}}"></div></div>
<div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; margin-top: 4px"><span>1:42</span><span>-2:16</span></div>
</div>

<div style="margin-top: auto; padding-right: 28px; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.5">
<div><span style="color: {{accent}}">◀ ▶</span> TRACK · <span style="color: {{accent}}">FUNC</span> PLAY/PAUSE</div>
<div><span style="color: {{accent}}">HOLD FUNC</span> UNLOCK</div>
</div>
</div>

<div style="flex-grow: 1; box-sizing: border-box; background: #f4f1ea; color: #14120f; padding: 32px 22px; display: flex; flex-direction: column">
<div style="font-size: 112px; font-weight: 700; line-height: 0.82; letter-spacing: -0.06em; margin-left: -4px">20<br>59</div>
<div style="margin-top: 18px; font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; letter-spacing: 0.08em; line-height: 1.4">THU<br>12 NOV</div>
<div style="margin-top: auto">
<div style="font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.08em">BATTERY 87%</div>
<div style="margin-top: 6px; height: 12px; border: 3px solid #14120f; box-sizing: border-box"><div style="width: 87%; height: 100%; background: #14120f"></div></div>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#2b59ff","#1f9d55","#e0268f"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#ff5a1f' };
  }
}
</script>
</body>
</html>
