<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Optional PIN</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 640px; height: 480px; box-sizing: border-box; background: #14120f; color: #f4f1ea; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="flex-grow: 1; display: flex; min-height: 0">

<div style="width: 290px; flex-shrink: 0; box-sizing: border-box; padding: 32px 0 24px 32px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.1em">
<svg width="22" height="26" viewBox="0 0 22 26" fill="none" stroke="{{accent}}" stroke-width="3" aria-hidden="true"><rect x="2" y="11" width="18" height="13" fill="{{accent}}"/><path d="M6 11V7a5 5 0 0 1 10 0v4"/></svg>
UNLOCK</div>
<div style="font-size: 54px; font-weight: 700; line-height: 0.95; letter-spacing: -0.03em; margin-top: 26px">Enter<br>your PIN</div>
<div style="display: flex; gap: 10px; margin-top: 26px" aria-label="Three of four digits typed" role="img">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4">
<span style="width: 48px; height: 62px; box-sizing: border-box; border: 3px solid #f4f1ea; background: {{d.bg}}"></span>
</sc-for>
</div>
<div style="margin-top: 18px; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #bdb8ab; line-height: 1.4">3 TRIES LEFT<br>THEN YOU WAIT</div>
<div style="margin-top: auto; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.5"><span style="color: {{accent}}">FUNC</span> USE PASSWORD<br><span style="color: {{accent}}">B</span> DELETE</div>
</div>

<div style="flex-grow: 1; box-sizing: border-box; background: #f4f1ea; color: #14120f; padding: 22px 24px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{pad}}" as="k" hint-placeholder-count="12">
<div style="box-sizing: border-box; background: {{k.bg}}; color: {{k.fg}}; border: {{k.border}}; display: flex; align-items: center; justify-content: center; font-size: {{k.size}}px; font-weight: 700; line-height: 1; font-family: {{k.font}}">{{k.label}}</div>
</sc-for>
</div>

</div>

<div style="height: 52px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 22px; background: #f4f1ea; color: #14120f; border-top: 4px solid #f4f1ea; font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.04em">
<span><span style="color: #14120f">◀▶▲▼</span> MOVE</span>
<span><span style="color: #14120f">A</span> TYPE THE DIGIT</span>
<span style="margin-left: auto; font-size: 14px">OR TAP THE KEYS</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#2b59ff","#1f9d55","#e0268f"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff5a1f';
    const labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'DEL', '0', 'OK'];
    const focus = '5';
    const pad = labels.map((label) => {
      const on = label === focus;
      const word = label.length > 1;
      return {
        label,
        size: word ? 20 : 40,
        font: word ? "'Space Mono', monospace" : "'Space Grotesk', sans-serif",
        bg: on ? accent : (word ? '#14120f' : '#e7e2d5'),
        fg: on ? '#14120f' : (word ? '#f4f1ea' : '#14120f'),
        border: on ? '4px solid #14120f' : '2px solid #14120f'
      };
    });
    const dots = [1, 1, 1, 0].map((f) => ({ bg: f ? '#f4f1ea' : 'transparent' }));
    return { pad, dots, accent };
  }
}
</script>
</body>
</html>
