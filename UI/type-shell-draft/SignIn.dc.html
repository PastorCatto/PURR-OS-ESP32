<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, choose an account</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a.btn{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width: 640px; height: 480px; box-sizing: border-box; background: #f4f1ea; color: #14120f; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 44px; box-sizing: border-box; padding: 0 24px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 4px solid #14120f; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.1em">
<span></span>
<span>SIGN IN</span>
<span style="justify-self: end">
<span style="display: inline-block; width: 44px; height: 14px; border: 3px solid #14120f; box-sizing: border-box" aria-label="Battery 87 percent" role="img"><span style="display: block; width: 87%; height: 100%; background: #14120f"></span></span>
</span>
</div>

<div style="flex-grow: 1; display: flex; min-height: 0">

<div style="width: 420px; box-sizing: border-box; display: flex; flex-direction: column; padding-top: 6px">
<sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
<a class="btn" href="Password.dc.html" style="height: 78px; box-sizing: border-box; display: flex; align-items: center; gap: 18px; padding: 0 18px 0 22px; background: {{row.bg}}; color: {{row.fg}}; border-bottom: 2px solid #14120f">
<span style="width: 50px; height: 50px; flex-shrink: 0; box-sizing: border-box; background: {{row.tile}}; color: {{row.tilefg}}; border: 3px solid {{row.fg}}; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 700; line-height: 1">{{row.initial}}</span>
<span style="flex-grow: 1; min-width: 0">
<span style="display: block; font-size: 38px; font-weight: 700; letter-spacing: -0.02em; line-height: 1">{{row.name}}</span>
<span style="display: block; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; margin-top: 4px">{{row.role}}</span>
</span>
<span style="font-size: 26px; color: {{row.chev}}" aria-hidden="true">▸</span>
</a>
</sc-for>
</div>

<div style="flex-grow: 1; box-sizing: border-box; background: {{accent}}; border-left: 4px solid #14120f; padding: 20px 20px 16px; display: flex; flex-direction: column">
<div style="font-family: 'Space Mono', monospace; font-size: 17px; font-weight: 700; letter-spacing: 0.08em">THU 12 NOV</div>
<div style="font-size: 124px; font-weight: 700; line-height: 0.82; letter-spacing: -0.05em; margin-top: 14px">20<br>59</div>
<div style="margin-top: auto; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; line-height: 1.4">WHO IS<br>SIGNING IN?</div>
</div>

</div>

<div style="height: 52px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 24px; background: #14120f; color: #f4f1ea; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.06em">
<span><span style="color: {{accent}}">▲▼</span> CHOOSE</span>
<span><span style="color: {{accent}}">A</span> OPEN</span>
<span style="margin-left: auto; font-size: 15px; color: #bdb8ab">OR TAP AN ACCOUNT</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#2b59ff","#1f9d55","#e0268f"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff5a1f';
    const people = [
      { name: 'MEOW', role: 'ADMINISTRATOR' },
      { name: 'Sam', role: 'STANDARD USER' },
      { name: 'Guest', role: 'STANDARD USER' }
    ];
    const rows = people.map((p, i) => {
      const on = i === 0;
      return {
        name: p.name,
        role: p.role,
        initial: p.name[0].toUpperCase(),
        bg: on ? '#14120f' : 'transparent',
        fg: on ? '#f4f1ea' : '#14120f',
        tile: on ? accent : '#14120f',
        tilefg: on ? '#14120f' : '#f4f1ea',
        chev: on ? accent : '#14120f'
      };
    });
    return { rows, accent };
  }
}
</script>
</body>
</html>
