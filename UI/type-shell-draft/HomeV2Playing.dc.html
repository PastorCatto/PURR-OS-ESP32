<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home v2, music playing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
a.btn{text-decoration:none;color:inherit}
</style>
</helmet>
<div style="width: 640px; height: 480px; box-sizing: border-box; background: #f4f1ea; color: #14120f; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="height: 44px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 4px solid #14120f; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.06em">
<span style="display: flex; align-items: center; gap: 12px"><span style="color: {{accent}}; -webkit-text-stroke: 1px #14120f" aria-label="Playing" role="img">▶</span>20:59 · THU 12 NOV</span>
<span style="display: flex; align-items: center; gap: 12px">WI-FI
<span style="display: inline-block; width: 44px; height: 14px; border: 3px solid #14120f; box-sizing: border-box" aria-label="Battery 87 percent" role="img"><span style="display: block; width: 87%; height: 100%; background: #14120f"></span></span>
87%</span>
</div>

<div style="flex-grow: 1; box-sizing: border-box; padding: 14px 28px 0; display: flex; flex-direction: column; min-height: 0">

<div style="display: flex; gap: 24px; align-items: stretch">
<div style="width: 184px; height: 184px; flex-shrink: 0; position: relative; overflow: hidden; background: #14120f; border: 4px solid #14120f; box-sizing: border-box; box-shadow: 8px 8px 0 #14120f; margin: 0 8px 8px 0" role="img" aria-label="Cover art placeholder">
<div style="position: absolute; left: 28px; top: 14px; width: 120px; height: 120px; border-radius: 60px; background: #f4f1ea"></div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: repeating-linear-gradient(180deg, #14120f 0, #14120f 10px, {{accent}} 10px, {{accent}} 20px)"></div>
</div>
<div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1">
<div style="font-family: 'Space Mono', monospace; font-size: 16px; font-weight: 700; letter-spacing: 0.1em">NOW PLAYING · 03 / 11</div>
<div style="font-size: 62px; font-weight: 700; line-height: 0.95; letter-spacing: -0.04em; margin-top: 8px">Night Shift</div>
<div style="font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.06em; margin-top: 8px">THE BENCH NOTES</div>
<div style="margin-top: auto; padding-bottom: 6px">
<div style="height: 14px; border: 3px solid #14120f; box-sizing: border-box"><div style="width: 43%; height: 100%; background: #14120f"></div></div>
<div style="display: flex; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; margin-top: 4px"><span>1:42</span><span>-2:16</span></div>
</div>
</div>
</div>

<div style="margin-top: auto; padding: 0 0 12px">
<div style="display: grid; grid-template-columns: 1.7fr 1fr 1fr 1fr; gap: 12px">
<sc-for list="{{tiles}}" as="tile" hint-placeholder-count="4">
<a class="btn" href="{{tile.href}}" style="box-sizing: border-box; height: 72px; background: {{tile.bg}}; border: {{tile.border}}; box-shadow: {{tile.shadow}}; transform: {{tile.move}}; padding: 6px 10px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0">
<span style="display: flex; align-items: center; justify-content: space-between; font-family: 'Space Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 0.08em">
<span>{{tile.name}}</span>
<span style="width: 20px; height: 20px; box-sizing: border-box; background: #14120f; color: #f4f1ea; display: flex; align-items: center; justify-content: center; font-size: 13px">{{tile.key}}</span>
</span>
<span style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 30px; font-weight: 700; line-height: 0.9; letter-spacing: -0.03em">{{tile.big}}</span>
<span style="font-family: 'Space Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{tile.sub}}</span>
</span>
</a>
</sc-for>
</div>
</div>
</div>

<div style="height: 52px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 22px; background: #14120f; color: #f4f1ea; font-family: 'Space Mono', monospace; font-size: 18px; font-weight: 700; letter-spacing: 0.06em">
<span><span style="color: {{accent}}">◀ ▶</span> CHOOSE</span>
<span><span style="color: {{accent}}">A</span> OPEN</span>
<span><span style="color: {{accent}}">FUNC</span> PLAY/PAUSE</span>
<span style="margin-left: auto"><span style="color: {{accent}}">FUNC+ABXY</span> SHORTCUT</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#ff5a1f","options":["#ff5a1f","#2b59ff","#1f9d55","#e0268f"]},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#ff5a1f';
    const defs = [
      { key: 'A', name: 'APPS', big: '≡', sub: '11 APPS', href: 'AppsPlaying.dc.html' },
      { key: 'B', name: 'WEATHER', big: '18°', sub: 'CLEAR', href: '#' },
      { key: 'X', name: 'MUSIC', big: '▶', sub: 'PLAYING', href: 'Music.dc.html' },
      { key: 'Y', name: 'FRIENDS', big: '2', sub: 'ONLINE', href: '#' }
    ];
    const tiles = defs.map((t, i) => {
      const on = i === 0;
      return {
        key: t.key,
        name: t.name,
        big: t.big,
        sub: t.sub,
        href: t.href,
        bg: on ? accent : 'transparent',
        border: on ? '4px solid #14120f' : '3px solid #14120f',
        shadow: on ? '5px 5px 0 #14120f' : 'none',
        move: on ? 'translate(-2px, -2px)' : 'none'
      };
    });
    return { tiles, accent };
  }
}
</script>
</body>
</html>
